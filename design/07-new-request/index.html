<body class="bg-background text-ink font-body-16 text-body-16 min-h-screen flex justify-center selection:bg-primary-container selection:text-ink">
<!-- Mobile Screen Container (393px width standard frame) -->
<main class="w-full max-w-[393px] min-h-screen bg-background flex flex-col relative pb-10 shadow-sm border-x border-hairline/40">
<!-- Top Sticky Header -->
<header class="sticky top-0 z-30 bg-background/95 backdrop-blur-md px-margin pt-4 pb-3 flex items-center justify-between border-b border-hairline">
<div class="flex items-center gap-2">
<h1 class="font-display-32 text-title-20 font-bold text-ink tracking-tight">New request</h1>
</div>
<button aria-label="Close" class="w-9 h-9 rounded-full flex items-center justify-center text-ink hover:bg-surface-alt active:scale-95 transition-all" type="button">
<span class="material-symbols-outlined text-[22px]">close</span>
</button>
</header>
<!-- Scrollable Form Body -->
<div class="flex-1 px-margin pt-5 space-y-6">
<!-- Section: Site Selector -->
<section class="space-y-1.5">
<label class="block font-label-14 text-label-14 font-semibold text-ink" for="facility-site">
          Facility / Site
        </label>
<div class="relative">
<button class="w-full bg-surface text-ink text-left px-3.5 py-3 rounded-xl border border-control-border flex items-center justify-between focus:outline-none focus:ring-2 focus:ring-primary-container active:scale-[0.99] transition-all" id="facility-site" type="button">
<span class="font-body-16 text-label-14 font-medium text-ink truncate">Northgate Office Park - Building A</span>
<span class="material-symbols-outlined text-text-tertiary flex-shrink-0 ml-2">expand_more</span>
</button>
</div>
</section>
<!-- Section: Service Type Selection -->
<section class="space-y-2">
<div class="flex items-center justify-between">
<span class="font-label-14 text-label-14 font-semibold text-ink">Service type</span>
<span class="font-caption-13 text-caption-13 text-text-secondary">Required</span>
</div>
<div class="flex flex-wrap gap-2">
<!-- Janitorial -->
<button class="px-3.5 py-2 rounded-full border border-hairline bg-surface text-ink font-label-14 text-caption-13 font-medium hover:border-control-border active:scale-95 transition-all" type="button">
            Janitorial
          </button>
<!-- Floor care (SELECTED) -->
<button class="px-4 py-2 rounded-full bg-primary-container text-ink font-label-14 text-caption-13 font-semibold shadow-xs flex items-center gap-1.5 active:scale-95 transition-all" type="button">
<span class="material-symbols-outlined text-base">check</span>
            Floor care
          </button>
<!-- Windows -->
<button class="px-3.5 py-2 rounded-full border border-hairline bg-surface text-ink font-label-14 text-caption-13 font-medium hover:border-control-border active:scale-95 transition-all" type="button">
            Windows
          </button>
<!-- Restroom -->
<button class="px-3.5 py-2 rounded-full border border-hairline bg-surface text-ink font-label-14 text-caption-13 font-medium hover:border-control-border active:scale-95 transition-all" type="button">
            Restroom
          </button>
<!-- Spill / urgent -->
<button class="px-3.5 py-2 rounded-full border border-hairline bg-surface text-ink font-label-14 text-caption-13 font-medium hover:border-control-border active:scale-95 transition-all" type="button">
            Spill / urgent
          </button>
<!-- Other -->
<button class="px-3.5 py-2 rounded-full border border-hairline bg-surface text-ink font-label-14 text-caption-13 font-medium hover:border-control-border active:scale-95 transition-all" type="button">
            Other
          </button>
</div>
</section>
<!-- Section: Description Textarea -->
<section class="space-y-1.5">
<label class="block font-label-14 text-label-14 font-semibold text-ink" for="request-description">
          Description
        </label>
<div class="relative">
<textarea class="w-full bg-surface text-ink text-label-14 font-body-16 p-3.5 rounded-xl border border-control-border focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-control-border resize-none leading-relaxed" id="request-description" placeholder="Describe the service needed in detail..." rows="3">Coffee stain near elevator bank, 2nd floor carpet, about 3 ft wide.</textarea>
</div>
</section>
<!-- Section: Focal Photos & Attachments -->
<section class="space-y-2">
<div class="flex items-center justify-between">
<label class="font-label-14 text-label-14 font-semibold text-ink">
            Photos &amp; attachments
          </label>
<span class="font-caption-13 text-caption-13 text-text-secondary">(2 attached)</span>
</div>
<div class="flex items-center gap-3 overflow-x-auto pb-1 custom-scroll">
<!-- Thumbnail 1 -->
<div class="relative flex-shrink-0 w-24 h-24 rounded-xl overflow-hidden bg-surface-alt border border-hairline shadow-xs">

<span class="material-symbols-outlined text-[14px]">close</span>
</button>
</div>
<!-- Thumbnail 2 -->
<div class="relative flex-shrink-0 w-24 h-24 rounded-xl overflow-hidden bg-surface-alt border border-hairline shadow-xs">
<img alt="Elevator floor overview with stain" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDFof7OBsKhNSB0xJeEA1XNNIWo1w3e6ItEt4iFYuo14XlB_GxzzUm-lwbNlYPfyFAxM96mD7AH_jNESdnIVBQAIN1nB8vwieufFxUzN39o6NCjxnKthnMyXzMmbzfyOTsDssi8tVd41Ra3ll8AIadm_vL2XSlrf6L5TJsIo-V5ikhFouX6VwAODUFYOEkuRixJ4sL4vKs13grDhb-IH1mwv50lgu1eTvG7nX0xRaYk0gtrlrWg-h9K0ACcS_Q7QMqh-utpf3B_dA8"/>
<button aria-label="Remove image 2" class="absolute top-1.5 right-1.5 w-6 h-6 rounded-full bg-ink/80 hover:bg-ink text-surface flex items-center justify-center transition-all active:scale-90" type="button">
<span class="material-symbols-outlined text-[14px]">close</span>
</button>
</div>
<!-- Add Photo Tile -->
<button class="flex-shrink-0 w-24 h-24 rounded-xl border-[1.5px] border-dashed border-control-border bg-accent-tint/30 flex flex-col items-center justify-center gap-1 text-ink hover:bg-accent-tint/60 active:scale-95 transition-all" type="button">
<span class="material-symbols-outlined text-ink text-[22px]">photo_camera</span>
<span class="font-caption-13 text-[12px] font-semibold text-ink leading-tight">+ Add photo</span>
</button>
</div>
</section>
<!-- Section: Preferred Timing Chips -->
<section class="space-y-2">
<label class="block font-label-14 text-label-14 font-semibold text-ink">
          Preferred timing
        </label>
<div class="grid grid-cols-3 gap-2">
<!-- ASAP -->
<button class="py-2.5 px-3 rounded-full border border-hairline bg-surface text-ink font-label-14 text-caption-13 font-medium text-center hover:border-control-border active:scale-95 transition-all" type="button">
            ASAP
          </button>
<!-- This week (SELECTED) -->
<button class="py-2.5 px-3 rounded-full bg-primary-container text-ink font-label-14 text-caption-13 font-semibold text-center shadow-xs active:scale-95 transition-all" type="button">
            This week
          </button>
<!-- Next visit -->
<button class="py-2.5 px-3 rounded-full border border-hairline bg-surface text-ink font-label-14 text-caption-13 font-medium text-center hover:border-control-border active:scale-95 transition-all" type="button">
            Next visit
          </button>
</div>
</section>
<!-- Section: Notification Toggle -->
<section class="bg-surface rounded-2xl p-4 border border-hairline flex items-center justify-between shadow-xs">
<div class="space-y-0.5 pr-3">
<p class="font-label-14 text-label-14 font-semibold text-ink">Text me when scheduled</p>
<p class="font-caption-13 text-caption-13 text-text-secondary">SMS updates to (512) 555-0192</p>
</div>
<!-- Switch Toggle ON -->
<button aria-checked="true" class="w-12 h-7 bg-primary-container rounded-full p-1 flex items-center transition-colors focus:outline-none flex-shrink-0 cursor-pointer" role="switch" type="button">
<div class="w-5 h-5 bg-ink rounded-full shadow-sm transform translate-x-5 transition-transform"></div>
</button>
</section>
<!-- Submit CTA Area -->
<section class="pt-2 space-y-2.5">
<button class="w-full bg-primary-container hover:bg-accent-pressed active:scale-[0.98] text-ink font-label-14 text-body-16 font-semibold py-3.5 px-6 rounded-full transition-all shadow-sm flex items-center justify-center gap-2" type="button">
<span>Submit request</span>
<span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
<p class="text-center font-caption-13 text-caption-13 text-text-secondary">
          Goes straight to the Midas scheduling team
        </p>
</section>
</div>
</main>

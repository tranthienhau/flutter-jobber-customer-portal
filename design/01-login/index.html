<body class="bg-background text-ink antialiased min-h-screen flex items-center justify-center p-0 sm:p-4">
<!-- Mobile Frame Container (393px width constraint) -->
<main class="w-full max-w-[393px] min-h-[852px] bg-background relative flex flex-col justify-between overflow-x-hidden shadow-2xl sm:rounded-[36px] sm:border sm:border-hairline">
<!-- Top Content Area -->
<div class="w-full flex flex-col">
<!-- 1. Top Section / Hero (No Text Overlay) -->
<div class="relative w-full h-[228px] overflow-hidden bg-surface-alt">
<img alt="" class="w-full h-full object-cover object-center" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD7KaHxREVuPHbnAGfu2UVXBSjgVOSBco4IBylR0-PgTz6mYA-_C-NrLwoIyCJKIUq3p2qAgv-tCLbJIDXY6AG-DaVI5gPN_fEx_B7z8Tx96lZfzNcxlL_MKfx5bbojxBP1tMQ-ELZKRKhqCIvtDMO9sa26WFxcCCbgj9SDfwBraTWPJ7OkkTS8RwjwKXrbzAvrlVzydNuhgvyjK5qM9dQiUHNhRQ2uZ9XrxmuvNRtdGF8fxIyw1DKSqFUjhoaBcAkQxiThxwpNR9M"/>
<!-- Subtle soft gradient fade blending lemon (#FFD60A) and sky blue (#7DB8FF) into warm background (#FCFAF4) -->
<div class="absolute inset-x-0 bottom-0 h-24 pointer-events-none bg-gradient-to-t from-background via-background/80 to-transparent"></div>
<div class="absolute inset-x-0 bottom-0 h-14 pointer-events-none opacity-40 bg-gradient-to-r from-primary-container/20 via-transparent to-secondary-container/25 mix-blend-multiply"></div>
</div>
<!-- 2. Brand Identity & Header Section -->
<div class="px-margin -mt-7 relative z-10 flex flex-col items-start">
<!-- Midas Monogram Tile -->
<div class="w-11 h-11 rounded-xl bg-ink flex items-center justify-center p-1.5 shadow-md border border-hairline overflow-hidden mb-3.5">
<img alt="Midas Monogram" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida/AEtjO1WhBpPXGUyDT9sxHZEHD0gvHJjq_Zwnty-sOn0cEpEWxIoJCGxkEG7fSi4UvR7ey3oD8XXcTxG5uM-bvNy1EVVvO7zfOwHqGN6k54134mvhBgwMPF_WRKHpJN34uy8xCM2E3LqEHTfmFVP34grm2yOF2Ac83CtZi6afxBb1oAoeL3j7v_FOSVoZ8Wic-6g1vf0Rpc2Iw6J1etIAHbOZSDQy52pYac_Cj6_bVjxuy2xRzhCBGomrJb3pix0"/>
</div>
<!-- Typography Header -->
<h1 class="font-display-32 text-title-20 text-ink tracking-tight font-semibold">
          Welcome back
        </h1>
<p class="font-label-14 text-label-14 text-text-secondary mt-1">
          Manage your sites, requests and invoices in one place
        </p>
</div>
<!-- 3. Form Card -->
<div class="px-margin mt-5">
<div class="bg-surface rounded-2xl p-space-xl soft-card-shadow border border-hairline flex flex-col gap-4">
<!-- Email Input -->
<div class="flex flex-col gap-1.5">
<label class="font-label-14 text-label-14 text-ink font-medium" for="work-email">
              Work email
            </label>
<div class="relative flex items-center">
<span class="material-symbols-outlined text-text-tertiary absolute left-3 pointer-events-none text-[20px]" data-icon="mail">mail</span>
<input class="w-full h-12 pl-10 pr-3 rounded-xl bg-surface border border-control-border text-ink font-body-16 text-body-16 focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-transparent transition-all" id="work-email" type="email" value="ops@northgateoffice.com"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-1.5">
<div class="flex justify-between items-center">
<label class="font-label-14 text-label-14 text-ink font-medium" for="password">
                Password
              </label>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined text-text-tertiary absolute left-3 pointer-events-none text-[20px]" data-icon="lock">lock</span>
<input class="w-full h-12 pl-10 pr-10 rounded-xl bg-surface border border-control-border text-ink font-body-16 text-body-16 tracking-widest focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-transparent transition-all" id="password" type="password" value="secretPassword123"/>
<button aria-label="Toggle password visibility" class="absolute right-3 text-text-tertiary hover:text-ink transition-colors flex items-center justify-center p-1" onclick="const pwd = document.getElementById('password'); const icon = this.querySelector('span'); if (pwd.type === 'password') { pwd.type = 'text'; pwd.classList.remove('tracking-widest'); icon.textContent = 'visibility_off'; } else { pwd.type = 'password'; pwd.classList.add('tracking-widest'); icon.textContent = 'visibility'; }" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end -mt-1">
<a class="font-caption-13 text-caption-13 text-accent-fill font-semibold hover:underline" href="#">
              Forgot password?
            </a>
</div>
<!-- Primary CTA Button -->
<div class="mt-2 flex flex-col gap-3">
<button class="w-full h-12 rounded-full bg-primary-container hover:bg-accent-pressed active:scale-[0.99] transition-all flex items-center justify-center font-label-14 text-label-14 font-bold text-ink shadow-sm" type="button">
              Sign in
            </button>
<!-- Secondary CTA Button -->
<button class="w-full h-12 rounded-full bg-surface border border-control-border hover:bg-surface-alt active:scale-[0.99] transition-all flex items-center justify-center font-label-14 text-label-14 font-semibold text-ink" type="button">
              Use a magic link instead
            </button>
</div>
</div>
</div>
</div>
<!-- 4. Footer Note & Safe Area Indicator -->
<footer class="px-margin pt-6 pb-8 flex flex-col items-center justify-center text-center">
<div class="flex items-center justify-center gap-1.5 text-text-tertiary">
<span class="material-symbols-outlined text-[16px] text-text-tertiary" data-icon="verified_user">verified_user</span>
<span class="font-caption-13 text-caption-13">
          Your portal account is linked to your Midas service agreement
        </span>
</div>
<div class="mt-2 text-caption-12 text-text-secondary opacity-75">
        Commercial Facility Operations &amp; Infrastructure Management
      </div>
</footer>
</main>
